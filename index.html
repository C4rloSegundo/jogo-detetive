<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Caderneta de Sherlock</title>
  <meta name="description" content="Bloco de notas do jogo Scotland Yard – Sherlock Holmes: pistas por local, chaves e perguntas do caso.">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" id="theme-color" content="#EFEEE7">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Caderneta">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script>
    // Aplica o tema salvo antes de pintar, pra não piscar
    (function () {
      var t = "auto";
      try { t = (JSON.parse(localStorage.getItem("caderneta-sherlock-v1")) || {}).theme || "auto"; } catch (e) {}
      var dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      if (t !== "auto") document.documentElement.setAttribute("data-th", t);
      document.getElementById("theme-color").setAttribute("content", dark ? "#0E1311" : "#EFEEE7");
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Libre+Franklin:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <select id="caso-sel" class="case-select" aria-label="Escolher caso"></select>
    <button type="button" class="icon-btn" id="theme-btn" data-action="theme" aria-label="Alternar tema"><span id="theme-icon">◐</span></button>
    <button type="button" class="btn-new" data-action="new-case">Novo</button>
  </header>

  <section class="hero">
    <div class="eyebrow">
      <span>Scotland Yard</span>
      <span class="eyebrow-rule"></span>
      <span id="saved" aria-live="polite"></span>
    </div>
    <div class="case-id">
      <div class="num-wrap">
        <label class="num-label" for="numero">Caso nº</label>
        <input id="numero" inputmode="numeric" autocomplete="off" placeholder="—">
      </div>
      <input id="titulo" aria-label="Título do caso" autocomplete="off" placeholder="Título do caso">
    </div>
  </section>

  <nav class="tabs" aria-label="Seções">
    <button type="button" class="tab" data-action="tab" data-tab="caso" aria-pressed="true"><span>Caso</span><span class="tab-count"></span></button>
    <button type="button" class="tab" data-action="tab" data-tab="locais" aria-pressed="false"><span>Locais</span><span class="tab-count"></span></button>
    <button type="button" class="tab" data-action="tab" data-tab="perguntas" aria-pressed="false"><span>Perguntas</span><span class="tab-count"></span></button>
  </nav>

  <main id="panel"></main>

</div>
<script src="app.js"></script>
</body>
</html>
